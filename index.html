<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmand.fun - Tous les Jeux</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* En-tête */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #1e293b;
            border-bottom: 2px solid #334155;
            height: 70px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #3b82f6;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: #f59e0b; }

        .header-actions { display: flex; align-items: center; gap: 15px; }

        .admin-badge {
            font-size: 0.85rem;
            background-color: #334155;
            padding: 6px 12px;
            border-radius: 8px;
            color: #94a3b8;
        }

        .admin-badge.logged { background-color: #065f46; color: #34d399; }

        .btn-add {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-add:hover { background-color: #059669; transform: translateY(-2px); }

        /* Vues : Accueil vs Jeu actif */
        #home-view { padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; display: block; }
        #game-view { display: none; flex-direction: column; width: 100vw; height: calc(100vh - 70px); }

        /* Grille des Cartes */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .game-card {
            background-color: #1e293b;
            border-radius: 20px;
            border: 2px solid #334155;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.2);
        }

        .card-preview {
            height: 160px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border-bottom: 2px solid #334155;
            user-select: none;
        }

        .card-info {
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f8fafc;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .btn-delete:hover { opacity: 1; }

        .empty-msg {
            text-align: center;
            color: #64748b;
            font-size: 1.1rem;
            margin-top: 60px;
            grid-column: 1 / -1;
        }

        /* Barre supérieure du jeu ouvert */
        .game-header {
            background-color: #1e293b;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            height: 50px;
        }

        .btn-back {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back:hover { background-color: #475569; }

        iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
            background: #0f172a;
        }

        /* Modal Sécurisé */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background-color: #1e293b;
            border: 2px solid #3b82f6;
            border-radius: 20px;
            padding: 30px;
            width: 440px;
            max-width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .modal-card h2 { margin-bottom: 15px; color: #3b82f6; font-size: 1.4rem; }
        .modal-card label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; text-align: left; }
        
        .modal-card input, .modal-card textarea, .modal-card select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .modal-card textarea { height: 120px; resize: vertical; font-family: monospace; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background-color: #475569;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

    <!-- Importation des SDKs Firebase (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addData, getDocs, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuration Firebase fournie
        const firebaseConfig = {
            apiKey: "AIzaSyAkSlA1QytOQvmhpz_eTu1I5BdN1zClpPY",
            authDomain: "jeux-feuxxx.firebaseapp.com",
            databaseURL: "https://jeux-feuxxx-default-rtdb.firebaseio.com",
            projectId: "jeux-feuxxx",
            storageBucket: "jeux-feuxxx.firebasestorage.app",
            messagingSenderId: "351401695038",
            appId: "1:351401695038:web:dd3dbd6c5ff85aeb81fe6f",
            measurementId: "G-41PSST98ZZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let cachedGames = [];

        // Suivi de l'état de connexion Admin
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const badge = document.getElementById('adminBadge');
            if (user) {
                badge.innerText = "Admin connecté 🔒";
                badge.classList.add('logged');
            } else {
                badge.innerText = "Mode Visiteur";
                badge.classList.remove('logged');
            }
        });

        // Charger les jeux en temps réel depuis Firestore
        function loadGamesRealtime() {
            const q = query(collection(db, "games"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                cachedGames = [];
                snapshot.forEach((docSnap) => {
                    cachedGames.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGrid(cachedGames);
            }, (error) => {
                console.error("Erreur de chargement : ", error);
            });
        }

        window.handleAction = async function() {
            if (!currentUser) {
                // Tentative de connexion Admin
                const email = document.getElementById('adminEmail').value.trim();
                const pass = document.getElementById('adminPass').value.trim();
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                    showGameForm();
                } catch (error) {
                    alert('Identifiants incorrects : ' + error.message);
                }
            } else {
                // Ajout d'un jeu
                const title = document.getElementById('gameTitle').value.trim();
                const emoji = document.getElementById('gameEmoji').value.trim() || '🎮';
                const type = document.getElementById('sourceType').value;
                const content = type === 'url' 
                    ? document.getElementById('gameUrl').value.trim() 
                    : document.getElementById('gameCode').value.trim();

                if (!title || !content) {
                    alert('Veuillez remplir le titre et le contenu du jeu !');
                    return;
                }

                const colors = ['#fbcfe8', '#fed7aa', '#fef08a', '#ddd6fe', '#cbd5e1', '#bbf7d0', '#bfdbfe'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                try {
                    const { addDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                    await addDoc(collection(db, "games"), {
                        title: title,
                        emoji: emoji,
                        bg: randomColor,
                        type: type,
                        content: content,
                        createdAt: Date.now()
                    });
                    closeModal();
                    // Reset
                    document.getElementById('gameTitle').value = '';
                    document.getElementById('gameEmoji').value = '';
                    document.getElementById('gameUrl').value = '';
                    document.getElementById('gameCode').value = '';
                } catch (err) {
                    alert("Erreur lors de l'ajout : " + err.message);
                }
            }
        };

        window.deleteGame = async function(event, gameId) {
            event.stopPropagation();
            if (!currentUser) {
                alert("Vous devez être connecté en tant qu'administrateur pour supprimer un jeu ! Cliquez sur '+ Ajouter un jeu' pour vous connecter.");
                openAddGameModal();
                return;
            }

            if (confirm("Voulez-vous vraiment supprimer ce jeu pour tout le monde ?")) {
                try {
                    await deleteDoc(doc(db, "games", gameId));
                } catch (err) {
                    alert("Erreur lors de la suppression : " + err.message);
                }
            }
        };

        window.cachedGamesRef = () => cachedGames;
        document.addEventListener('DOMContentLoaded', loadGamesRealtime);
    </script>
</head>
<body>

    <!-- En-tête principal -->
    <header id="main-header">
        <div class="logo" onclick="showHome()">Gourmand<span>.fun</span></div>
        <div class="header-actions">
            <div id="adminBadge" class="admin-badge">Mode Visiteur</div>
            <button class="btn-add" onclick="openAddGameModal()">+ Ajouter un jeu</button>
        </div>
    </header>

    <!-- Page d'accueil (Grille) -->
    <main id="home-view">
        <h1 style="font-size: 2rem; margin-bottom: 10px;">Mes Jeux</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">Cliquez sur un rectangle pour jouer ou sur "+ Ajouter un jeu" pour en créer un nouveau en ligne !</p>

        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <!-- Vue du Jeu -->
    <div id="game-view">
        <div class="game-header">
            <button class="btn-back" onclick="showHome()">← Retour aux jeux</button>
            <h2 id="activeGameTitle" style="font-size: 1.1rem; color: #f8fafc;">Titre du Jeu</h2>
            <div style="width: 120px;"></div>
        </div>
        <iframe id="gameFrame"></iframe>
    </div>

    <!-- Modal d'Authentification / Ajout Admin -->
    <div class="modal" id="addModal">
        <div class="modal-card">
            <h2>🔒 Espace Administrateur</h2>
            
            <div id="authSection">
                <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px;">Connectez-vous avec votre compte Firebase Admin.</p>
                <label>Email Admin</label>
                <input type="email" id="adminEmail" placeholder="admin@gourmand.fun">
                <label>Mot de passe</label>
                <input type="password" id="adminPass" placeholder="Mot de passe...">
            </div>

            <div id="gameFields" style="display: none;">
                <label>Titre du Jeu</label>
                <input type="text" id="gameTitle" placeholder="Ex: Semaine du Goût">

                <label>Icône / Emoji d'aperçu</label>
                <input type="text" id="gameEmoji" placeholder="Ex: 🍎, 🍕, 🏃..." maxlength="2">

                <label>Source du Jeu</label>
                <select id="sourceType" onchange="toggleSourceInput()">
                    <option value="code">Code HTML / JS direct</option>
                    <option value="url">Lien URL (ex: https://...)</option>
                </select>

                <div id="codeInputContainer" style="margin-top: 10px;">
                    <label>Code HTML du jeu</label>
                    <textarea id="gameCode" placeholder="Collez le code <!DOCTYPE html> ici..."></textarea>
                </div>

                <div id="urlInputContainer" style="display: none; margin-top: 10px;">
                    <label>URL Web du jeu</label>
                    <input type="url" id="gameUrl" placeholder="https://exemple.com/jeu">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Annuler</button>
                <button type="button" class="btn-submit" id="submitBtn" onclick="handleAction()">Se connecter</button>
            </div>
        </div>
    </div>

    <script>
        function renderGrid(gamesList) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (gamesList.length === 0) {
                grid.innerHTML = `<div class="empty-msg">Aucun jeu disponible pour le moment.<br>Connectez-vous en admin via <strong>"+ Ajouter un jeu"</strong> pour commencer !</div>`;
                return;
            }

            gamesList.forEach((game) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchGame(game.id);

                card.innerHTML = `
                    <div class="card-preview" style="background-color: ${game.bg || '#1e293b'}">
                        ${game.emoji || '🎮'}
                    </div>
                    <div class="card-info">
                        <div class="card-title">${game.title}</div>
                        <button class="btn-delete" onclick="deleteGame(event, '${game.id}')" title="Supprimer">🗑️</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function launchGame(gameId) {
            const game = window.cachedGamesRef().find(g => g.id === gameId);
            if (!game) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('main-header').style.display = 'none';
            
            const gameView = document.getElementById('game-view');
            gameView.style.display = 'flex';

            document.getElementById('activeGameTitle').innerText = game.title;
            const frame = document.getElementById('gameFrame');

            if (game.type === 'url') {
                frame.src = game.content;
            } else {
                const doc = frame.contentWindow.document;
                doc.open();
                doc.write(game.content);
                doc.close();
            }
        }

        function showHome() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('main-header').style.display = 'flex';
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('gameFrame').src = 'about:blank';
        }

        function openAddGameModal() {
            document.getElementById('addModal').style.display = 'flex';
            // Vérifier globalement l'état via l'UI ou laisser le script module gérer
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('adminPass').value = '';
        }

        function showGameForm() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('gameFields').style.display = 'block';
            document.getElementById('submitBtn').innerText = 'Ajouter la carte';
        }

        function toggleSourceInput() {
            const type = document.getElementById('sourceType').value;
            document.getElementById('codeInputContainer').style.display = type === 'code' ? 'block' : 'none';
            document.getElementById('urlInputContainer').style.display = type === 'url' ? 'block' : 'none';
        }
    </script>
</body>
</html>
