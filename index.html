<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaine du Goût</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-card {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 { color: #1e293b; margin: 0 0 5px 0; font-size: 1.8rem; }
        .subtitle { color: #64748b; margin: 0 0 20px 0; font-size: 0.95rem; }

        .avatar-container {
            background-color: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed #cbd5e1;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .avatar {
            font-size: 90px;
            line-height: 1;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .bubble {
            background: #ffffff;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 1.05rem;
            color: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            position: relative;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px;
            border-style: solid;
            border-color: #334155 transparent;
        }

        .open-pantry-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.2s ease;
        }

        .open-pantry-btn:hover { background-color: #2563eb; transform: translateY(-2px); }

        .pantry-drawer {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 85%;
            background-color: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.15);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .pantry-drawer.open { bottom: 0; }

        .pantry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .close-btn {
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            color: #64748b;
            font-weight: bold;
        }

        .food-scroll-area { overflow-y: auto; flex-grow: 1; }
        .category-title { text-align: left; font-size: 0.85rem; font-weight: bold; color: #64748b; margin: 15px 0 8px 0; text-transform: uppercase; }
        .food-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        .food-item {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .food-item:hover { transform: scale(1.05); background-color: #f1f5f9; }
        .food-item .emoji { font-size: 1.8rem; }
        .food-item .name { font-size: 0.75rem; color: #334155; font-weight: 600; }

        /* Animations */
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .anim-bounce { animation: bounce 0.5s ease; }
        .anim-shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Semaine du Goût 🍎</h1>
        <p class="subtitle">Fais-moi goûter quelque chose !</p>

        <div id="avatarContainer" class="avatar-container">
            <div id="avatar" class="avatar">😐</div>
            <div id="bubble" class="bubble">Mmmh, j'ai une petite faim... Qu'est-ce qu'on mange ?</div>
        </div>

        <button class="open-pantry-btn" onclick="togglePantry(true)">
            🍽️ Ouvrir le garde-manger
        </button>

        <div id="pantryDrawer" class="pantry-drawer">
            <div class="pantry-header">
                <span style="font-weight: bold; color: #1e293b;">Bibliothèque d'aliments</span>
                <button class="close-btn" onclick="togglePantry(false)">✕</button>
            </div>

            <div class="food-scroll-area">
                <div class="category-title">🍭 Sucré</div>
                <div class="food-grid">
                    <div class="food-item" onclick="eat('🍩', 'Donut', 'sucré', '😋', '#fbcfe8', 'bounce')"><span class="emoji">🍩</span><span class="name">Donut</span></div>
                    <div class="food-item" onclick="eat('🍦', 'Glace', 'sucré', '😋', '#fbcfe8', 'bounce')"><span class="emoji">🍦</span><span class="name">Glace</span></div>
                    <div class="food-item" onclick="eat('🍫', 'Chocolat', 'sucré', '😋', '#fbcfe8', 'bounce')"><span class="emoji">🍫</span><span class="name">Chocolat</span></div>
                    <div class="food-item" onclick="eat('🍓', 'Fraise', 'sucré', '😋', '#fbcfe8', 'bounce')"><span class="emoji">🍓</span><span class="name">Fraise</span></div>
                </div>

                <div class="category-title">🍋 Acide</div>
                <div class="food-grid">
                    <div class="food-item" onclick="eat('🍋', 'Citron', 'acide', '😖', '#fef08a', 'shake')"><span class="emoji">🍋</span><span class="name">Citron</span></div>
                    <div class="food-item" onclick="eat('🍏', 'Pomme verte', 'acide', '😖', '#fef08a', 'shake')"><span class="emoji">🍏</span><span class="name">Pomme</span></div>
                    <div class="food-item" onclick="eat('🥝', 'Kiwi', 'acide', '😖', '#fef08a', 'shake')"><span class="emoji">🥝</span><span class="name">Kiwi</span></div>
                    <div class="food-item" onclick="eat('🫒', 'Cornichon', 'acide', '😖', '#fef08a', 'shake')"><span class="emoji">🫒</span><span class="name">Cornichon</span></div>
                </div>

                <div class="category-title">🥨 Salé</div>
                <div class="food-grid">
                    <div class="food-item" onclick="eat('🥨', 'Pretzel', 'salé', '🤓', '#fed7aa', 'bounce')"><span class="emoji">🥨</span><span class="name">Pretzel</span></div>
                    <div class="food-item" onclick="eat('🍟', 'Frites', 'salé', '😋', '#fed7aa', 'bounce')"><span class="emoji">🍟</span><span class="name">Frites</span></div>
                    <div class="food-item" onclick="eat('🧀', 'Fromage', 'salé', '🧀', '#fed7aa', 'bounce')"><span class="emoji">🧀</span><span class="name">Fromage</span></div>
                    <div class="food-item" onclick="eat('🍿', 'Popcorn', 'salé', '🍿', '#fed7aa', 'bounce')"><span class="emoji">🍿</span><span class="name">Popcorn</span></div>
                </div>

                <div class="category-title">☕ Amer</div>
                <div class="food-grid">
                    <div class="food-item" onclick="eat('☕', 'Café noir', 'amer', '🤢', '#e2e8f0', 'shake')"><span class="emoji">☕</span><span class="name">Café</span></div>
                    <div class="food-item" onclick="eat('🥦', 'Brocoli', 'amer', '🧐', '#e2e8f0', 'bounce')"><span class="emoji">🥦</span><span class="name">Brocoli</span></div>
                </div>

                <div class="category-title">🌶️ Épicé</div>
                <div class="food-grid">
                    <div class="food-item" onclick="eat('🌶️', 'Piment', 'piquant', '🥵', '#fecaca', 'shake')"><span class="emoji">🌶️</span><span class="name">Piment</span></div>
                    <div class="food-item" onclick="eat('🧄', 'Ail', 'piquant', '🥵', '#fecaca', 'shake')"><span class="emoji">🧄</span><span class="name">Ail</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let idleTimer;

        // Réponses ultra-naturelles et directes selon le goût
        const responses = {
            sucré: [
                "Mmmhhh... C'est délicieux, bien sucré !",
                "Yum ! J'adore ce petit goût doux et sucré !",
                "Mmmhh c'est trop bon, c'est gourmand !"
            ],
            acide: [
                "Ouh là ! C'est hyper acide, ça fait grimacer !",
                "Brrr ! Ça pique les joues, c'est très acide !",
                "Aïe, ça secoue ! C'est très acide !"
            ],
            salé: [
                "Mmmhhh c'est bien salé et croustillant !",
                "Ah, un bon goût salé ! J'adore ça !",
                "Mmm, c'est savoureux et salé juste comme il faut !"
            ],
            amer: [
                "Pouah... C'est drôle comme goût, c'est amer !",
                "Beurk, c'est un peu fort et amer pour moi...",
                "Oof, l'amertume c'est particulier !"
            ],
            piquant: [
                "Ouch ! Ça brûle la langue, c'est piquant !",
                "Au feu ! C'est super épicé !",
                "Wouah ! Ça chauffe fort dans la bouche !"
            ]
        };

        const idlePhrases = [
            "Hé ho ! Tu m'as oublié ? J'ai encore faim !",
            "Psst... Choisis-moi un nouvel aliment !",
            "Tu penses que le prochain sera sucré ou salé ?",
            "Mon ventre commence à grouiller...",
            "Regarde dans le garde-manger !"
        ];

        function togglePantry(show) {
            document.getElementById('pantryDrawer').classList.toggle('open', show);
            resetIdleTimer();
        }

        function eat(emoji, nom, gout, avatarEmoji, color, anim) {
            togglePantry(false);
            
            const avatar = document.getElementById('avatar');
            const bubble = document.getElementById('bubble');
            const container = document.getElementById('avatarContainer');

            avatar.className = 'avatar';
            void avatar.offsetWidth; // Force le rafraîchissement de l'animation

            avatar.textContent = avatarEmoji;
            avatar.classList.add(`anim-${anim}`);
            container.style.backgroundColor = color;

            const list = responses[gout];
            const reaction = list[Math.floor(Math.random() * list.length)];
            
            bubble.textContent = `${emoji} ${reaction}`;

            resetIdleTimer();
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(talkWhenIdle, 6000); // Réagit après 6 secondes d'inactivité
        }

        function talkWhenIdle() {
            const bubble = document.getElementById('bubble');
            const avatar = document.getElementById('avatar');
            
            avatar.textContent = '🤔';
            const randomIdle = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
            bubble.textContent = randomIdle;

            resetIdleTimer();
        }

        resetIdleTimer();
    </script>
</body>
</html>
