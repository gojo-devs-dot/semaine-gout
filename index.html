<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmand.fun - Tous les Jeux</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* En-tête */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #1e293b;
            border-bottom: 2px solid #334155;
            height: 70px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #3b82f6;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: #f59e0b; }

        .header-actions { display: flex; align-items: center; gap: 15px; }

        .admin-badge {
            font-size: 0.85rem;
            background-color: #334155;
            padding: 6px 12px;
            border-radius: 8px;
            color: #94a3b8;
        }

        .admin-badge.logged { background-color: #065f46; color: #34d399; }

        .btn-add {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-add:hover { background-color: #059669; transform: translateY(-2px); }

        /* Vues : Accueil vs Jeu actif */
        #home-view { padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; display: block; }
        #game-view { display: none; flex-direction: column; width: 100vw; height: calc(100vh - 70px); position: relative; }

        /* Grille des Cartes */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .game-card {
            background-color: #1e293b;
            border-radius: 20px;
            border: 2px solid #334155;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.2);
        }

        /* Badge plateforme */
        .platform-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }
        .platform-badge.pc { color: #60a5fa; }
        .platform-badge.mobile { color: #34d399; }
        .platform-badge.all { color: #f59e0b; }

        .card-preview {
            height: 160px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border-bottom: 2px solid #334155;
            user-select: none;
        }

        .card-info {
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f8fafc;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .btn-delete:hover { opacity: 1; }

        .empty-msg {
            text-align: center;
            color: #64748b;
            font-size: 1.1rem;
            margin-top: 60px;
            grid-column: 1 / -1;
        }

        /* Barre supérieure du jeu ouvert */
        .game-header {
            background-color: #1e293b;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            height: 50px;
        }

        .btn-back {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back:hover { background-color: #475569; }

        iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
            background: #0f172a;
        }

        /* Fenêtre "Cliquez pour jouer" (donne le focus clavier au jeu) */
        .focus-overlay {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            gap: 12px;
        }

        .focus-box {
            background: #1e293b;
            border: 2px solid #3b82f6;
            border-radius: 20px;
            padding: 30px 50px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .focus-box span { display: block; font-size: 3rem; margin-bottom: 10px; }

        /* Modal Sécurisé */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background-color: #1e293b;
            border: 2px solid #3b82f6;
            border-radius: 20px;
            padding: 30px;
            width: 440px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .modal-card h2 { margin-bottom: 15px; color: #3b82f6; font-size: 1.4rem; }
        .modal-card label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; text-align: left; }
        
        .modal-card input, .modal-card textarea, .modal-card select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .modal-card textarea { height: 120px; resize: vertical; font-family: monospace; }

        .btn-google {
            width: 100%;
            background-color: #ffffff;
            color: #1e293b;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            margin-top: 10px;
        }
        .btn-google:hover { background-color: #f1f5f9; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background-color: #475569;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

    <!-- Importation des SDKs Firebase (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkSlA1QytOQvmhpz_eTu1I5BdN1zClpPY",
            authDomain: "jeux-feuxxx.firebaseapp.com",
            databaseURL: "https://jeux-feuxxx-default-rtdb.firebaseio.com",
            projectId: "jeux-feuxxx",
            storageBucket: "jeux-feuxxx.firebasestorage.app",
            messagingSenderId: "351401695038",
            appId: "1:351401695038:web:dd3dbd6c5ff85aeb81fe6f",
            measurementId: "G-41PSST98ZZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let cachedGames = [];
        const ADMIN_EMAIL = "x.kaboom.x02@gmail.com";

        // Suivi de l'état de connexion Admin avec filtrage strict par email
        onAuthStateChanged(auth, (user) => {
            const badge = document.getElementById('adminBadge');
            if (user && user.email === ADMIN_EMAIL) {
                currentUser = user;
                badge.innerText = "Admin connecté 🔒";
                badge.classList.add('logged');
                showGameForm();
            } else if (user) {
                alert("Accès refusé : Seul l'administrateur (" + ADMIN_EMAIL + ") peut gérer les jeux.");
                signOut(auth);
                currentUser = null;
                badge.innerText = "Mode Visiteur";
                badge.classList.remove('logged');
                showAuthSection();
            } else {
                currentUser = null;
                badge.innerText = "Mode Visiteur";
                badge.classList.remove('logged');
                showAuthSection();
            }
        });

        // Connexion avec Google
        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Erreur de connexion Google : " + error.message);
            }
        };

        // Charger les jeux en temps réel depuis Firestore
        function loadGamesRealtime() {
            const q = query(collection(db, "games"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                cachedGames = [];
                snapshot.forEach((docSnap) => {
                    cachedGames.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGrid(cachedGames);
            }, (error) => {
                console.error("Erreur de chargement : ", error);
            });
        }

        window.submitGame = async function() {
            if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
                alert("Seul l'administrateur peut ajouter un jeu !");
                return;
            }

            const title = document.getElementById('gameTitle').value.trim();
            const emoji = document.getElementById('gameEmoji').value.trim() || '🎮';
            const platform = document.getElementById('gamePlatform').value;
            const type = document.getElementById('sourceType').value;
            const content = type === 'url' 
                ? document.getElementById('gameUrl').value.trim() 
                : document.getElementById('gameCode').value.trim();

            if (!title || !content) {
                alert('Veuillez remplir le titre et le contenu du jeu !');
                return;
            }

            const colors = ['#fbcfe8', '#fed7aa', '#fef08a', '#ddd6fe', '#cbd5e1', '#bbf7d0', '#bfdbfe'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            try {
                await addDoc(collection(db, "games"), {
                    title: title,
                    emoji: emoji,
                    bg: randomColor,
                    type: type,
                    platform: platform,
                    content: content,
                    createdAt: Date.now()
                });
                closeModal();
                document.getElementById('gameTitle').value = '';
                document.getElementById('gameEmoji').value = '';
                document.getElementById('gameUrl').value = '';
                document.getElementById('gameCode').value = '';
            } catch (err) {
                alert("Erreur lors de l'ajout : " + err.message);
            }
        };

        window.deleteGame = async function(event, gameId) {
            event.stopPropagation();
            if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
                alert("Seul l'administrateur peut supprimer un jeu !");
                openAddGameModal();
                return;
            }

            if (confirm("Voulez-vous vraiment supprimer ce jeu pour tout le monde ?")) {
                try {
                    await deleteDoc(doc(db, "games", gameId));
                } catch (err) {
                    alert("Erreur lors de la suppression : " + err.message);
                }
            }
        };

        window.cachedGamesRef = () => cachedGames;
        document.addEventListener('DOMContentLoaded', loadGamesRealtime);
    </script>
</head>
<body>

    <!-- En-tête principal -->
    <header id="main-header">
        <div class="logo" onclick="showHome()">Gourmand<span>.fun</span></div>
        <div class="header-actions">
            <div id="adminBadge" class="admin-badge">Mode Visiteur</div>
            <button class="btn-add" onclick="openAddGameModal()">+ Ajouter un jeu</button>
        </div>
    </header>

    <!-- Page d'accueil (Grille) -->
    <main id="home-view">
        <h1 style="font-size: 2rem; margin-bottom: 10px;">Mes Jeux</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">Cliquez sur un rectangle pour jouer ou sur "+ Ajouter un jeu" pour en créer un nouveau en ligne !</p>

        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <!-- Vue du Jeu -->
    <div id="game-view">
        <div class="game-header">
            <button class="btn-back" onclick="showHome()">← Retour aux jeux</button>
            <h2 id="activeGameTitle" style="font-size: 1.1rem; color: #f8fafc;">Titre du Jeu</h2>
            <div style="width: 120px;"></div>
        </div>
        <iframe id="gameFrame"></iframe>

        <!-- Clic obligatoire pour que le clavier soit pris en compte -->
        <div id="focusOverlay" class="focus-overlay" onclick="startPlaying()">
            <div class="focus-box"><span>🎮</span>Cliquez ici pour jouer</div>
        </div>
    </div>

    <!-- Modal d'Authentification / Ajout Admin -->
    <div class="modal" id="addModal">
        <div class="modal-card">
            <h2>🔒 Espace Administrateur</h2>
            
            <div id="authSection">
                <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">Connectez-vous avec votre compte Google Administrateur.</p>
                <button type="button" class="btn-google" onclick="loginWithGoogle()">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Se connecter avec Google
                </button>
            </div>

            <div id="gameFields" style="display: none;">
                <label>Titre du Jeu</label>
                <input type="text" id="gameTitle" placeholder="Ex: Semaine du Goût">

                <label>Icône / Emoji d'aperçu</label>
                <input type="text" id="gameEmoji" placeholder="Ex: 🍎, 🍕, 🏃..." maxlength="2">

                <label>Plateforme</label>
                <select id="gamePlatform">
                    <option value="pc">💻 PC (clavier)</option>
                    <option value="mobile">📱 Téléphone (tactile)</option>
                    <option value="all">📱💻 PC + Téléphone</option>
                </select>

                <label>Source du Jeu</label>
                <select id="sourceType" onchange="toggleSourceInput()">
                    <option value="code">Code HTML / JS direct</option>
                    <option value="url">Lien URL (ex: https://...)</option>
                </select>

                <div id="codeInputContainer" style="margin-top: 10px;">
                    <label>Code HTML du jeu</label>
                    <textarea id="gameCode" placeholder="Collez le code <!DOCTYPE html> ici..."></textarea>
                </div>

                <div id="urlInputContainer" style="display: none; margin-top: 10px;">
                    <label>URL Web du jeu</label>
                    <input type="url" id="gameUrl" placeholder="https://exemple.com/jeu">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Fermer</button>
                <button type="button" class="btn-submit" id="submitBtn" onclick="submitGame()" style="display: none;">Ajouter la carte</button>
            </div>
        </div>
    </div>

    <script>
        const platformLabels = {
            pc: '💻 PC',
            mobile: '📱 Téléphone',
            all: '📱💻 PC + Tél.'
        };

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function renderGrid(gamesList) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (gamesList.length === 0) {
                grid.innerHTML = `<div class="empty-msg">Aucun jeu disponible pour le moment.<br>Connectez-vous en admin via <strong>"+ Ajouter un jeu"</strong> pour commencer !</div>`;
                return;
            }

            gamesList.forEach((game) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchGame(game.id);

                const p = platformLabels[game.platform] ? game.platform : 'pc';

                card.innerHTML = `
                    <div class="platform-badge ${p}">${platformLabels[p]}</div>
                    <div class="card-preview" style="background-color: ${escapeHtml(game.bg || '#1e293b')}">
                        ${escapeHtml(game.emoji || '🎮')}
                    </div>
                    <div class="card-info">
                        <div class="card-title">${escapeHtml(game.title)}</div>
                        <button class="btn-delete" onclick="deleteGame(event, '${game.id}')" title="Supprimer">🗑️</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function launchGame(gameId) {
            const game = window.cachedGamesRef().find(g => g.id === gameId);
            if (!game) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('main-header').style.display = 'none';
            
            const gameView = document.getElementById('game-view');
            gameView.style.display = 'flex';

            document.getElementById('activeGameTitle').innerText = game.title;
            const frame = document.getElementById('gameFrame');

            if (game.type === 'url') {
                frame.src = game.content;
            } else {
                const doc = frame.contentWindow.document;
                doc.open();
                doc.write(game.content);
                doc.close();
            }

            // Affiche la fenêtre "Cliquez ici pour jouer"
            document.getElementById('focusOverlay').style.display = 'flex';
        }

        function startPlaying() {
            document.getElementById('focusOverlay').style.display = 'none';
            const frame = document.getElementById('gameFrame');
            frame.focus();
            try { frame.contentWindow.focus(); } catch (e) {}
        }

        function showHome() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('focusOverlay').style.display = 'none';
            document.getElementById('main-header').style.display = 'flex';
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('gameFrame').src = 'about:blank';
        }

        function openAddGameModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function showGameForm() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('gameFields').style.display = 'block';
            document.getElementById('submitBtn').style.display = 'block';
        }

        function showAuthSection() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('gameFields').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
        }

        function toggleSourceInput() {
            const type = document.getElementById('sourceType').value;
            document.getElementById('codeInputContainer').style.display = type === 'code' ? 'block' : 'none';
            document.getElementById('urlInputContainer').style.display = type === 'url' ? 'block' : 'none';
        }
    </script>
</body>
</html>
