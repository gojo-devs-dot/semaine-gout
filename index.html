<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmand.fun - Tous les Jeux</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        /* En-tête Neal.fun Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #1e293b;
            border-bottom: 2px solid #334155;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #3b82f6;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: #f59e0b; }

        .btn-add {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-add:hover { background-color: #059669; transform: translateY(-2px); }

        /* Vues : Accueil vs Jeu actif */
        #home-view { padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; }
        #game-view { display: none; flex-direction: column; flex-grow: 1; height: calc(100vh - 80px); }

        /* Grille des Cartes (Neal.fun) */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .game-card {
            background-color: #1e293b;
            border-radius: 20px;
            border: 2px solid #334155;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.2);
        }

        .card-preview {
            height: 160px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border-bottom: 2px solid #334155;
            user-select: none;
        }

        .card-info {
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f8fafc;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .btn-delete:hover { opacity: 1; }

        /* Barre supérieure du jeu ouvert */
        .game-header {
            background-color: #1e293b;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
        }

        .btn-back {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back:hover { background-color: #475569; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }

        /* Modal Sécurisé */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background-color: #1e293b;
            border: 2px solid #3b82f6;
            border-radius: 20px;
            padding: 30px;
            width: 440px;
            max-width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .modal-card h2 { margin-bottom: 15px; color: #3b82f6; font-size: 1.4rem; }
        .modal-card label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; text-align: left; }
        
        .modal-card input, .modal-card textarea, .modal-card select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .modal-card textarea { height: 100px; resize: vertical; font-family: monospace; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background-color: #475569;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <div class="logo" onclick="showHome()">Gourmand<span>.fun</span></div>
        <button class="btn-add" onclick="openAddGameModal()">+ Ajouter un jeu</button>
    </header>

    <!-- Page d'accueil (Grille de jeux) -->
    <main id="home-view">
        <h1 style="font-size: 2rem; margin-bottom: 10px;">Jeux de la Semaine du Goût</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">Cliquez sur un rectangle pour lancer une expérience culinaire ou un jeu !</p>

        <div class="games-grid" id="gamesGrid">
            <!-- Les cartes sont générées dynamiquement ici -->
        </div>
    </main>

    <!-- Vue Jeu Actif (Plein écran sous le header) -->
    <div id="game-view">
        <div class="game-header">
            <button class="btn-back" onclick="showHome()">← Retour aux jeux</button>
            <h2 id="activeGameTitle" style="font-size: 1.1rem; color: #f8fafc;">Titre du Jeu</h2>
            <div></div>
        </div>
        <iframe id="gameFrame"></iframe>
    </div>

    <!-- Modal d'Ajout (Protégé par Mot de Passe) -->
    <div class="modal" id="addModal">
        <div class="modal-card">
            <h2>🔒 Accès Administrateur</h2>
            <form onsubmit="handleAuthAndAdd(event)">
                <div id="authSection">
                    <label>Mot de passe Administrateur</label>
                    <input type="password" id="adminPass" placeholder="Mot de passe..." required>
                </div>

                <div id="gameFields" style="display: none;">
                    <label>Titre du Jeu</label>
                    <input type="text" id="gameTitle" placeholder="Ex: Chef Pizza, Testeur de Saveurs...">

                    <label>Icône / Emoji d'aperçu</label>
                    <input type="text" id="gameEmoji" placeholder="Ex: 🍕, 🍓, 🍔..." maxlength="2">

                    <label>Source du Jeu</label>
                    <select id="sourceType" onchange="toggleSourceInput()">
                        <option value="code">Code HTML / JS direct</option>
                        <option value="url">Lien URL (ex: https://...)</option>
                    </select>

                    <div id="codeInputContainer" style="margin-top: 10px;">
                        <label>Code HTML du jeu</label>
                        <textarea id="gameCode" placeholder="<!DOCTYPE html>..."></textarea>
                    </div>

                    <div id="urlInputContainer" style="display: none; margin-top: 10px;">
                        <label>URL Web du jeu</label>
                        <input type="url" id="gameUrl" placeholder="https://exemple.com/jeu">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Vérifier</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "GOUT2026";
        let isAuthenticated = false;

        // Jeux de base
        const defaultGames = [
            {
                id: 'game-gout',
                title: 'Semaine du Goût 🍎',
                emoji: '🍎',
                bg: '#fbcfe8',
                type: 'code',
                content: `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><style>* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; } body { background: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; } .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; } h1 { color: #1e293b; margin-bottom: 10px; } input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; margin-bottom: 10px; font-size: 1rem; } button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; } .res { margin-top: 15px; font-size: 1.2rem; font-weight: bold; color: #0f172a; }</style></head><body><div class="card"><h1>Semaine du Goût 🍎</h1><p style="color:#64748b; margin-bottom:15px;">Entrez un aliment pour le tester :</p><input type="text" id="food" placeholder="Ex: Citron, Chocolat..."><button onclick="test()">Goûter !</button><div id="res" class="res"></div></div><script>function test(){ const f = document.getElementById('food').value; if(!f) return; const t = ['😋 Sucré', '😖 Acide', '🤓 Salé', '🤢 Amer', '🥵 Piquant']; const r = t[Math.floor(Math.random()*t.length)]; document.getElementById('res').innerText = f + " -> " + r; }<\/script></body></html>`
            },
            {
                id: 'game-parkour',
                title: 'Parkour Gourmand 🏃',
                emoji: '🏃',
                bg: '#fed7aa',
                type: 'code',
                content: `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><style>* { box-sizing: border-box; margin: 0; padding: 0; } body { background: #0b0c10; font-family: sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; } canvas { background: #1f2833; border: 3px solid #ff9f43; border-radius: 12px; }</style></head><body><canvas id="c" width="800" height="400"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let p={x:50,y:300,w:30,h:30,vy:0,g:0.8,j:false};let obs=[];setInterval(()=>{obs.push({x:800,w:20,h:40})},1500);function loop(){p.vy+=p.g;p.y+=p.vy;if(p.y>=320){p.y=320;p.vy=0;p.j=false;}x.fillStyle='#1f2833';x.fillRect(0,0,800,400);x.fillStyle='#ff9f43';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#ff4757';obs.forEach((o,i)=>{o.x-=5;x.fillRect(o.x,310,o.w,o.h);});requestAnimationFrame(loop);}window.onkeydown=e=>{if(e.code==='Space'&&!p.j){p.vy=-13;p.j=true;}};loop();<\/script></body></html>`
            }
        ];

        let games = JSON.parse(localStorage.getItem('gourmand_games')) || defaultGames;

        document.addEventListener('DOMContentLoaded', renderGrid);

        function renderGrid() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchGame(game.id);

                card.innerHTML = `
                    <div class="card-preview" style="background-color: ${game.bg || '#1e293b'}">
                        ${game.emoji || '🎮'}
                    </div>
                    <div class="card-info">
                        <div class="card-title">${game.title}</div>
                        ${index >= 2 ? `<button class="btn-delete" onclick="deleteGame(event, '${game.id}')" title="Supprimer">🗑️</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function launchGame(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game) return;

            document.getElementById('home-view').style.display = 'none';
            const gameView = document.getElementById('game-view');
            gameView.style.display = 'flex';

            document.getElementById('activeGameTitle').innerText = game.title;
            const frame = document.getElementById('gameFrame');

            if (game.type === 'url') {
                frame.src = game.content;
            } else {
                const doc = frame.contentWindow.document;
                doc.open();
                doc.write(game.content);
                doc.close();
            }
        }

        function showHome() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('gameFrame').src = 'about:blank';
        }

        function openAddGameModal() {
            document.getElementById('addModal').style.display = 'flex';
            if (!isAuthenticated) {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('gameFields').style.display = 'none';
                document.getElementById('submitBtn').innerText = 'Vérifier';
            } else {
                showGameForm();
            }
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('adminPass').value = '';
        }

        function handleAuthAndAdd(event) {
            event.preventDefault();
            
            if (!isAuthenticated) {
                const pass = document.getElementById('adminPass').value;
                if (pass === ADMIN_PASSWORD) {
                    isAuthenticated = true;
                    showGameForm();
                } else {
                    alert('Mot de passe incorrect !');
                }
            } else {
                addNewGame();
            }
        }

        function showGameForm() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('gameFields').style.display = 'block';
            document.getElementById('submitBtn').innerText = 'Ajouter la carte';
        }

        function toggleSourceInput() {
            const type = document.getElementById('sourceType').value;
            document.getElementById('codeInputContainer').style.display = type === 'code' ? 'block' : 'none';
            document.getElementById('urlInputContainer').style.display = type === 'url' ? 'block' : 'none';
        }

        function addNewGame() {
            const title = document.getElementById('gameTitle').value.trim();
            const emoji = document.getElementById('gameEmoji').value.trim() || '🎮';
            const type = document.getElementById('sourceType').value;
            const content = type === 'url' 
                ? document.getElementById('gameUrl').value.trim() 
                : document.getElementById('gameCode').value.trim();

            if (!title || !content) {
                alert('Veuillez remplir tous les champs.');
                return;
            }

            const colors = ['#fbcfe8', '#fed7aa', '#fef08a', '#ddd6fe', '#cbd5e1', '#bbf7d0'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const newGame = {
                id: 'game-' + Date.now(),
                title: title,
                emoji: emoji,
                bg: randomColor,
                type: type,
                content: content
            };

            games.push(newGame);
            localStorage.setItem('gourmand_games', JSON.stringify(games));

            renderGrid();
            closeModal();

            // Reset
            document.getElementById('gameTitle').value = '';
            document.getElementById('gameEmoji').value = '';
            document.getElementById('gameUrl').value = '';
            document.getElementById('gameCode').value = '';
        }

        function deleteGame(event, gameId) {
            event.stopPropagation();
            if (confirm("Voulez-vous supprimer ce jeu de la liste ?")) {
                games = games.filter(g => g.id !== gameId);
                localStorage.setItem('gourmand_games', JSON.stringify(games));
                renderGrid();
            }
        }
    </script>
</body>
</html>
