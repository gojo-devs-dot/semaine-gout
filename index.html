<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaine du Goût - Vraie IA dans le Navigateur</title>
    <!-- Importation de la bibliothèque d'IA locale Transformers.js -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';
        window.pipeline = pipeline;
        // Désactive l'utilisation de modèles locaux inexistants pour tout charger depuis HuggingFace
        env.allowLocalModels = false;
    </script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .game-card { background-color: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px; max-width: 480px; width: 100%; text-align: center; }
        h1 { color: #1e293b; margin: 0 0 5px 0; font-size: 1.8rem; }
        .subtitle { color: #64748b; margin: 0 0 20px 0; font-size: 0.95rem; }
        .avatar-container { background-color: #f8fafc; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 2px dashed #cbd5e1; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: background-color 0.3s ease; }
        .avatar { font-size: 85px; line-height: 1; margin-bottom: 15px; transition: transform 0.3s ease; }
        .bubble { background: #ffffff; border: 2px solid #334155; border-radius: 16px; padding: 12px 20px; font-weight: 600; font-size: 1.05rem; color: #0f172a; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 90%; position: relative; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .bubble::after { content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); border-width: 0 10px 10px; border-style: solid; border-color: #334155 transparent; }
        .input-form { display: flex; gap: 10px; margin-top: 10px; }
        .food-input { flex-grow: 1; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 16px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .food-input:focus { border-color: #3b82f6; }
        .send-btn { background-color: #3b82f6; color: white; border: none; border-radius: 12px; padding: 12px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .send-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .anim-bounce { animation: bounce 0.5s ease; }
        .anim-shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Semaine du Goût 🧠</h1>
        <p class="subtitle">Propulsé par un modèle de réseau de neurones !</p>

        <div id="avatarContainer" class="avatar-container">
            <div id="avatar" class="avatar">🤖</div>
            <div id="bubble" class="bubble">Chargement du cerveau IA dans le jeu...</div>
        </div>

        <form class="input-form" onsubmit="handleFoodSubmit(event)">
            <input type="text" id="foodInput" class="food-input" placeholder="Ex: purée d'avocat, tiramisu, graines..." autocomplete="off" disabled required>
            <button type="submit" id="sendBtn" class="send-btn" disabled>Chargement...</button>
        </form>
    </div>

    <script>
        let classifier = null;
        let idleTimer;

        const candidateLabels = [
            'un aliment sucré', 
            'un aliment salé', 
            'un aliment acide', 
            'un aliment amer', 
            'un aliment piquant ou épicé'
        ];

        // Initialisation de l'IA au chargement de la page
        window.addEventListener('DOMContentLoaded', async () => {
            const bubble = document.getElementById('bubble');
            const input = document.getElementById('foodInput');
            const btn = document.getElementById('sendBtn');

            try {
                // Modèle d'IA Zero-Shot Classification ultra-léger
                classifier = await window.pipeline('zero-shot-classification', 'Xenova/mobilebert-uncased-mnli');
                
                bubble.textContent = "IA prête ! Propose-moi n'importe quel aliment !";
                document.getElementById('avatar').textContent = '😐';
                input.disabled = false;
                btn.disabled = false;
                btn.textContent = "Manger";
                resetIdleTimer();
            } catch (err) {
                console.error(err);
                bubble.textContent = "Impossible de charger le modèle IA.";
            }
        });

        async function handleFoodSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('foodInput');
            const userQuery = input.value.trim();

            if (!userQuery || !classifier) return;

            const avatar = document.getElementById('avatar');
            const bubble = document.getElementById('bubble');
            
            avatar.textContent = '🧠';
            bubble.textContent = `L'IA réfléchit au goût de "${userQuery}"...`;

            input.value = '';
            resetIdleTimer();

            try {
                // Analyse sémantique Zero-Shot par le réseau de neurones
                const output = await classifier(userQuery, candidateLabels);
                const topLabel = output.labels[0]; // Label avec la plus haute probabilité

                let taste = 'inconnu';
                if (topLabel.includes('sucré')) taste = 'sucré';
                else if (topLabel.includes('salé')) taste = 'salé';
                else if (topLabel.includes('acide')) taste = 'acide';
                else if (topLabel.includes('amer')) taste = 'amer';
                else if (topLabel.includes('piquant')) taste = 'piquant';

                applyResponse(userQuery, taste);
            } catch (e) {
                applyResponse(userQuery, 'inconnu');
            }
        }

        function applyResponse(foodName, taste) {
            const avatar = document.getElementById('avatar');
            const bubble = document.getElementById('bubble');
            const container = document.getElementById('avatarContainer');

            avatar.className = 'avatar';
            void avatar.offsetWidth;

            let emoji, bg, anim, text;

            switch (taste) {
                case 'sucré':
                    emoji = '😋'; bg = '#fbcfe8'; anim = 'bounce';
                    text = `D'après mon IA, ${foodName} est plutôt sucré !`;
                    break;
                case 'acide':
                    emoji = '😖'; bg = '#fef08a'; anim = 'shake';
                    text = `D'après mon IA, ${foodName} a un goût acide !`;
                    break;
                case 'salé':
                    emoji = '🤓'; bg = '#fed7aa'; anim = 'bounce';
                    text = `D'après mon IA, ${foodName} est salé !`;
                    break;
                case 'amer':
                    emoji = '🤢'; bg = '#e2e8f0'; anim = 'shake';
                    text = `D'après mon IA, ${foodName} tire vers l'amertume !`;
                    break;
                case 'piquant':
                    emoji = '🥵'; bg = '#fecaca'; anim = 'shake';
                    text = `Attention ! Mon IA détecte du piquant dans ${foodName} !`;
                    break;
                default:
                    emoji = '🧐'; bg = '#f1f5f9'; anim = 'bounce';
                    text = `Mmm, ${foodName}... Mon IA hésite sur la saveur !`;
                    break;
            }

            avatar.textContent = emoji;
            avatar.classList.add(`anim-${anim}`);
            container.style.backgroundColor = bg;
            bubble.textContent = text;
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                document.getElementById('avatar').textContent = '🤔';
                document.getElementById('bubble').textContent = "Donne-moi une idée de plat, je vais deviner sa saveur !";
                resetIdleTimer();
            }, 8000);
        }
    </script>
</body>
</html>
