<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaine du Goût - Grande Base de Données</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-card {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 { color: #1e293b; margin: 0 0 5px 0; font-size: 1.8rem; }
        .subtitle { color: #64748b; margin: 0 0 20px 0; font-size: 0.95rem; }

        .avatar-container {
            background-color: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed #cbd5e1;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .avatar {
            font-size: 85px;
            line-height: 1;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .bubble {
            background: #ffffff;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 1.05rem;
            color: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            position: relative;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px;
            border-style: solid;
            border-color: #334155 transparent;
        }

        .input-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .food-input {
            flex-grow: 1;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .food-input:focus { border-color: #3b82f6; }

        .send-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .send-btn:hover { background-color: #2563eb; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .anim-bounce { animation: bounce 0.5s ease; }
        .anim-shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Semaine du Goût 🍎</h1>
        <p class="subtitle">Recherche parmi des millions d'aliments !</p>

        <div id="avatarContainer" class="avatar-container">
            <div id="avatar" class="avatar">😐</div>
            <div id="bubble" class="bubble">Donne-moi n'importe quel aliment !</div>
        </div>

        <form class="input-form" onsubmit="handleFoodSubmit(event)">
            <input type="text" id="foodInput" class="food-input" placeholder="Ex: Nutella, Haribo, M&Ms, Kassler..." autocomplete="off" required>
            <button type="submit" class="send-btn">Manger</button>
        </form>
    </div>

    <script>
        let idleTimer;

        const idlePhrases = [
            "Hé ho ! Tu cherches quoi à manger ?",
            "Même les marques bizarres marchent, essaye !",
            "J'attends ta prochaine idée d'aliment...",
            "Tape n'importe quelle nourriture !",
            "Mon ventre attend le prochain plat !"
        ];

        async function handleFoodSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('foodInput');
            const foodQuery = input.value.trim();

            if (!foodQuery) return;

            const avatar = document.getElementById('avatar');
            const bubble = document.getElementById('bubble');
            
            avatar.textContent = '🔍';
            bubble.textContent = `Recherche de "${foodQuery}" dans la grande base...`;

            input.value = '';
            resetIdleTimer();

            // Recherche en direct via l'API Open Food Facts
            try {
                const response = await fetch(`https://fr.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(foodQuery)}&search_simple=1&action=process&json=1&page_size=1`);
                const data = await response.json();

                if (data.products && data.products.length > 0) {
                    const product = data.products[0];
                    const productName = product.product_name_fr || product.product_name || foodQuery;
                    const taste = analyzeProductTaste(product);
                    applyResponse(productName, taste);
                } else {
                    applyResponse(foodQuery, 'inconnu');
                }
            } catch (error) {
                // Secours local si pas de connexion internet
                applyResponse(foodQuery, 'inconnu');
            }
        }

        // Analyse la catégorie et les ingrédients renvoyés par la base de données
        function analyzeProductTaste(product) {
            const categories = (product.categories || '').toLowerCase();
            const ingredients = (product.ingredients_text || '').toLowerCase();
            const text = categories + ' ' + ingredients;

            if (text.match(/sucre|sucré|chocolat|bonbon|biscuit|confiserie|dessert|gâteau|fruit|miel|glace/)) return 'sucré';
            if (text.match(/citron|vinaigre|cornichon|acide|pamplemousse/)) return 'acide';
            if (text.match(/sel|salé|chips|fromage|charcuterie|pizza|pretzel|snack/)) return 'salé';
            if (text.match(/piment|poivre|épice|epice|moutarde|wasabi|harissa/)) return 'piquant';
            if (text.match(/café|cafe|cacao|endive|amer/)) return 'amer';

            return 'inconnu';
        }

        function applyResponse(foodName, taste) {
            const avatar = document.getElementById('avatar');
            const bubble = document.getElementById('bubble');
            const container = document.getElementById('avatarContainer');

            avatar.className = 'avatar';
            void avatar.offsetWidth;

            let emoji, bg, anim, text;

            switch (taste) {
                case 'sucré':
                    emoji = '😋'; bg = '#fbcfe8'; anim = 'bounce';
                    text = `Mmmhhh, ${foodName} ! C'est bien sucré !`;
                    break;
                case 'acide':
                    emoji = '😖'; bg = '#fef08a'; anim = 'shake';
                    text = `Ouh là ! ${foodName}, c'est hyper acide !`;
                    break;
                case 'salé':
                    emoji = '🤓'; bg = '#fed7aa'; anim = 'bounce';
                    text = `Mmm, ${foodName} ! Un bon goût salé !`;
                    break;
                case 'amer':
                    emoji = '🤢'; bg = '#e2e8f0'; anim = 'shake';
                    text = `Pouah ! ${foodName}, c'est amer...`;
                    break;
                case 'piquant':
                    emoji = '🥵'; bg = '#fecaca'; anim = 'shake';
                    text = `Au feu ! ${foodName}, ça pique fort !`;
                    break;
                default:
                    emoji = '🧐'; bg = '#f1f5f9'; anim = 'bounce';
                    text = `Mmm, ${foodName}... C'est un goût spécial !`;
                    break;
            }

            avatar.textContent = emoji;
            avatar.classList.add(`anim-${anim}`);
            container.style.backgroundColor = bg;
            bubble.textContent = text;
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(talkWhenIdle, 6000);
        }

        function talkWhenIdle() {
            const bubble = document.getElementById('bubble');
            const avatar = document.getElementById('avatar');
            
            avatar.textContent = '🤔';
            const randomIdle = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
            bubble.textContent = randomIdle;

            resetIdleTimer();
        }

        resetIdleTimer();
    </script>
</body>
</html>
