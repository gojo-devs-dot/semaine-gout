<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaine du Goût - IA locale</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-card {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 { color: #1e293b; margin: 0 0 5px 0; font-size: 1.8rem; }
        .subtitle { color: #64748b; margin: 0 0 20px 0; font-size: 0.95rem; }

        .avatar-container {
            background-color: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed #cbd5e1;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .avatar {
            font-size: 85px;
            line-height: 1;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .bubble {
            background: #ffffff;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 1.05rem;
            color: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            position: relative;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px;
            border-style: solid;
            border-color: #334155 transparent;
        }

        .input-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .food-input {
            flex-grow: 1;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .food-input:focus { border-color: #3b82f6; }

        .send-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .send-btn:hover { background-color: #2563eb; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .anim-bounce { animation: bounce 0.5s ease; }
        .anim-shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Semaine du Goût 🍎</h1>
        <p class="subtitle">Écris un aliment, l'IA cherche son goût !</p>

        <div id="avatarContainer" class="avatar-container">
            <div id="avatar" class="avatar">😐</div>
            <div id="bubble" class="bubble">Donne-moi un aliment à goûter !</div>
        </div>

        <form class="input-form" onsubmit="handleFoodSubmit(event)">
            <input type="text" id="foodInput" class="food-input" placeholder="Ex: pomme, bonbon, piment..." autocomplete="off" required>
            <button type="submit" class="send-btn">Manger</button>
        </form>
    </div>

    <script>
        let idleTimer;

        // Base de connaissance de l'IA locale
        const foodDatabase = [
            // Sucré
            { names: ['pomme', 'banane', 'fraise', 'bonbon', 'chocolat', 'glace', 'gateau', 'gâteau', 'donut', 'miel', 'sucre', 'nutella', 'confiture', 'mangue', 'poire', 'cerise', 'orange', 'crepe', 'crêpe'], taste: 'sucré' },
            // Acide
            { names: ['citron', 'vinaigre', 'cornichon', 'kiwi', 'pamplemousse', 'rhubarbe', 'bonbon acide', 'citron vert'], taste: 'acide' },
            // Salé
            { names: ['frite', 'frites', 'chips', 'pizza', 'fromage', 'bacon', 'pretzel', 'popcorn', 'jambon', 'saucisson', 'olive', 'sel', 'burger', 'ramen'], taste: 'salé' },
            // Amer
            { names: ['café', 'cafe', 'endive', 'brocoli', 'cacao', 'chou', 'thé noir', 'chocolat noir', 'biere', 'bière'], taste: 'amer' },
            // Piquant
            { names: ['piment', 'poivre', 'harissa', 'wasabi', 'moutarde', 'tabasco', 'ail', 'oignon', 'epice', 'épice', 'curry'], taste: 'piquant' }
        ];

        const idlePhrases = [
            "Hé ho ! Tu fais quoi ? J'ai faim !",
            "Tape un nom d'aliment dans la barre !",
            "Je m'ennuie... Donne-moi un truc à manger !",
            "Tu penses à quoi comme nourriture ?",
            "Mon ventre réclame à manger !"
        ];

        // Calcul de proximité de texte (IA de correspondance)
        function getSimilarity(s1, s2) {
            let longer = s1.length < s2.length ? s2 : s1;
            let shorter = s1.length < s2.length ? s1 : s2;
            if (longer.length === 0) return 1.0;
            return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            let costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function handleFoodSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('foodInput');
            const foodQuery = input.value.trim().toLowerCase();

            if (!foodQuery) return;

            // Phase de simulation de recherche IA
            const avatar = document.getElementById('avatar');
            const bubble = document.getElementById('bubble');
            avatar.textContent = '🔍';
            bubble.textContent = `Recherche du goût de "${foodQuery}"...`;

            setTimeout(() => {
                searchAndAnswer(foodQuery);
            }, 600); // Petit délai pour faire "effet recherche"

            input.value = '';
            resetIdleTimer();
        }

        function searchAndAnswer(query) {
            let bestMatchTaste = null;
            let highestScore = 0;

            // Analyse IA de la requête utilisateur
            for (const category of foodDatabase) {
                for (const foodName of category.names) {
                    if (query.includes(foodName) || foodName.includes(query)) {
                        bestMatchTaste = category.taste;
                        highestScore = 1;
                        break;
                    }
                    let score = getSimilarity(query, foodName);
                    if (score > highestScore && score > 0.6) {
                        highestScore = score;
                        bestMatchTaste = category.taste;
                    }
                }
            }

            // Détection directe par mot-clé de goût
            if (query.includes('sucre')) bestMatchTaste = 'sucré';
            else if (query.includes('acide')) bestMatchTaste = 'acide';
            else if (query.includes('sale') || query.includes('salé')) bestMatchTaste = 'salé';
            else if (query.includes('amer')) bestMatchTaste = 'amer';
            else if (query.includes('pique') || query.includes('piquant') || query.includes('epice')) bestMatchTaste = 'piquant';

            applyResponse(query, bestMatchTaste);
        }

        function applyResponse(foodName, taste) {
            const avatar = document.getElementById('avatar');
            const bubble = document.getElementById('bubble');
            const container = document.getElementById('avatarContainer');

            avatar.className = 'avatar';
            void avatar.offsetWidth;

            let emoji, bg, anim, text;

            switch (taste) {
                case 'sucré':
                    emoji = '😋'; bg = '#fbcfe8'; anim = 'bounce';
                    text = `Mmmhhh, ${foodName} ! C'est doux et sucré !`;
                    break;
                case 'acide':
                    emoji = '😖'; bg = '#fef08a'; anim = 'shake';
                    text = `Ouh là ! ${foodName}, c'est très acide !`;
                    break;
                case 'salé':
                    emoji = '🤓'; bg = '#fed7aa'; anim = 'bounce';
                    text = `Mmm, ${foodName} ! Un bon goût salé !`;
                    break;
                case 'amer':
                    emoji = '🤢'; bg = '#e2e8f0'; anim = 'shake';
                    text = `Pouah ! ${foodName}, c'est plutôt amer...`;
                    break;
                case 'piquant':
                    emoji = '🥵'; bg = '#fecaca'; anim = 'shake';
                    text = `Au feu ! ${foodName}, ça pique fort !`;
                    break;
                default:
                    emoji = '🧐'; bg = '#f1f5f9'; anim = 'bounce';
                    text = `Mmm, ${foodName}... C'est un goût particulier !`;
                    break;
            }

            avatar.textContent = emoji;
            avatar.classList.add(`anim-${anim}`);
            container.style.backgroundColor = bg;
            bubble.textContent = text;
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(talkWhenIdle, 6000);
        }

        function talkWhenIdle() {
            const bubble = document.getElementById('bubble');
            const avatar = document.getElementById('avatar');
            
            avatar.textContent = '🤔';
            const randomIdle = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
            bubble.textContent = randomIdle;

            resetIdleTimer();
        }

        resetIdleTimer();
    </script>
</body>
</html>
